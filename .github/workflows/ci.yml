name: MOSS 550W CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  static-and-unit:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync prototype environment
        run: uv sync --directory prototype --frozen --python 3.11.15

      - name: Run Release Gate (Static + Unit Suites)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: uv run --directory prototype python -u release_gate.py --stages static,unit --tag ci
