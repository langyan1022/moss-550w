<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#010305">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>550W · MOSS 移动端分身</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/vendor/logos/550w.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/vendor/fui.css">
  <link rel="stylesheet" href="/styles/console.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--fui-void);
      color: var(--fui-text);
      font-family: "Source Han Sans SC", var(--fui-font-cjk);
      overflow-x: hidden;
    }
    .m-shell {
      display: grid;
      grid-template-rows: auto auto auto auto auto minmax(0, 1fr) auto;
      height: 100dvh;
      overflow: hidden;
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      gap: 8px;
      box-sizing: border-box;
    }
    .m-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      border-bottom: 1px solid var(--fui-line-2);
      padding-bottom: 8px;
    }
    .m-brand { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .m-brand strong { font-size: 0.96rem; letter-spacing: 0.08em; color: var(--fui-text-hi); white-space: nowrap; }
    .m-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }
    .m-select {
      min-height: 36px;
      padding: 4px 6px;
      border: 1px solid var(--fui-line-2);
      background: var(--fui-surface-1);
      color: var(--fui-text-hi);
      font: 500 0.78rem / 1.2 var(--fui-font-sans);
      min-width: 0;
      width: 100%;
    }
    .m-select[hidden] { display: none; }
    .m-alert {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--fui-line-2);
      border-left: 3px solid var(--fui-info);
      background: var(--fui-surface-1);
      font-size: 0.78rem;
    }
    .m-alert[data-state="warn"] { border-left-color: var(--fui-warn); }
    .m-alert[data-state="crit"] { border-left-color: var(--fui-crit); }
    .m-alert[hidden] { display: none; }
    .m-alert__meta { flex: 1 1 auto; min-width: 0; }
    .m-alert__title { display: block; color: var(--fui-text-hi); font-weight: 600; }
    .m-alert__body { display: block; color: var(--fui-text-dim); overflow-wrap: anywhere; }
    .m-media {
      display: grid;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--fui-ok);
      border-left: 3px solid var(--fui-ok);
      background: var(--fui-surface-1);
    }
    .m-media__row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    @media (max-width: 460px) {
      .m-media__row { flex-wrap: wrap; }
    }
    .m-media__progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--fui-text-dim);
    }
    .m-media__seek { flex: 1 1 auto; min-width: 0; accent-color: var(--fui-ok); }
    .m-media__cover {
      width: 26px;
      height: 26px;
      object-fit: cover;
      border: 1px solid var(--fui-line-1);
      flex: none;
    }
    .m-media__lrc {
      font-size: 0.74rem;
      color: var(--fui-text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid var(--fui-line-1);
      padding-top: 4px;
    }
    .m-media__lrc[hidden], .m-media__queue[hidden], .m-media__cover[hidden] { display: none; }
    .m-media__queue {
      display: grid;
      gap: 3px;
      max-height: 78px;
      overflow-y: auto;
      border-top: 1px solid var(--fui-line-1);
      padding-top: 4px;
    }
    .m-media__qbtn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid var(--fui-line-1);
      background: var(--fui-surface-1);
      color: var(--fui-text-dim);
      font: 500 0.72rem / 1.2 var(--fui-font-sans);
      text-align: left;
      cursor: pointer;
    }
    .m-media__qbtn[aria-current="true"] {
      border-color: var(--fui-ok);
      color: var(--fui-text-hi);
    }
    .m-media__qname {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .m-media__ctrl[data-active="true"] {
      border-color: var(--fui-act);
      color: var(--fui-act);
    }
    .m-media__viz {
      display: block;
      width: 100%;
      height: 26px;
      border-top: 1px solid var(--fui-line-1);
      padding-top: 4px;
    }
    .m-auth {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--fui-bg);
    }
    .m-auth[hidden] { display: none; }
    .m-auth__card {
      width: min(360px, 100%);
      border: 1px solid var(--fui-line-hi);
      background: var(--fui-surface-1);
      padding: 16px;
      display: grid;
      gap: 10px;
    }
    .m-auth__hint { margin: 0; font-size: 0.76rem; color: var(--fui-text-dim); line-height: 1.45; }
    .m-auth__err { margin: 0; font-size: 0.78rem; color: var(--fui-crit); }
    .m-media[hidden] { display: none; }
    .m-media__meta { flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .m-media__title { display: block; font-size: 0.84rem; color: var(--fui-text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-media__artist { display: block; font-size: 0.72rem; color: var(--fui-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-quick {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .m-quick .fui-key { min-height: 38px; font-size: 0.76rem; padding: 0 4px; }
    .m-feed {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: grid;
      align-content: start;
      gap: 8px;
    }
    .m-msg {
      border: 1px solid var(--fui-line-1);
      border-left: 2px solid var(--fui-line-hi);
      padding: 8px 10px;
      background: var(--fui-surface-1);
      min-width: 0;
      content-visibility: auto;
      contain-intrinsic-size: 80px;
    }
    .m-msg--user { border-left-color: var(--fui-act); }
    .m-msg__role { font-size: 0.72rem; color: var(--fui-text-dim); margin-bottom: 4px; }
    .m-msg__text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; font-size: 0.92rem; color: var(--fui-text-hi); }
    .m-msg__body { min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; line-height: 1.5; color: var(--fui-text-hi); }
    .m-msg__extras { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .m-msg__actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .m-form {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--fui-line-2);
    }
    .m-input {
      min-height: 44px;
      min-width: 0;
      padding: 8px 10px;
      background: var(--fui-surface-1);
      color: var(--fui-text-hi);
      border: 1px solid var(--fui-line-2);
      font: inherit;
    }
  </style>
</head>
<body class="fui">
  <main class="m-shell">
    <header class="m-head">
      <div class="m-brand">
        <strong>550W · MOSS</strong>
        <button class="fui-badge" id="m-auth-chip" type="button" data-state="intel" title="点击切换 4 位授权码" style="cursor: pointer">MOSS</button>
        <span class="fui-badge" id="m-link" data-state="ok">SYNC</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="fui-key fui-key--sm" id="m-push" type="button" aria-pressed="false" title="开启后台 Web Push 系统通知" hidden>推送</button>
        <a class="fui-key fui-key--sm" href="/">主控台</a>
      </div>
    </header>

    <section class="m-controls" aria-label="会话与模型控制">
      <select class="m-select" id="m-chat-sel" aria-label="切换历史会话" hidden></select>
      <select class="m-select" id="m-personality" aria-label="MOSS 性格预设">
        <option value="partner">熟人搭档</option>
        <option value="rational">550W 绝对理性</option>
        <option value="lively">鲜活热络</option>
        <option value="sassy">傲娇嘴硬</option>
      </select>
      <select class="m-select" id="m-model" aria-label="推理模型"></select>
      <button class="fui-key fui-key--sm" id="m-tts" type="button" aria-pressed="false">播报 关</button>
    </section>

    <section class="m-alert" id="m-alert-banner" hidden>
      <span class="fui-badge" id="m-alert-badge" data-state="info">PULSE</span>
      <div class="m-alert__meta">
        <strong class="m-alert__title" id="m-alert-title">—</strong>
        <span class="m-alert__body" id="m-alert-body"></span>
      </div>
      <button class="fui-key fui-key--sm" id="m-alert-dismiss" type="button">关闭</button>
    </section>

    <section class="m-media" id="m-media-bar" aria-label="正在播放" hidden>
      <div class="m-media__row">
        <img class="m-media__cover" id="m-media-cover" alt="" hidden>
        <span class="fui-badge" id="m-media-badge" data-state="ok">AUD</span>
        <div class="m-media__meta">
          <strong class="m-media__title" id="m-media-title">—</strong>
          <span class="m-media__artist" id="m-media-artist">—</span>
        </div>
        <button class="fui-key fui-key--sm m-media__ctrl" id="m-media-prev" type="button" aria-label="上一首">‹</button>
        <button class="fui-key fui-key--sm" id="m-media-toggle" type="button">播放</button>
        <button class="fui-key fui-key--sm m-media__ctrl" id="m-media-next" type="button" aria-label="下一首">›</button>
        <button class="fui-key fui-key--sm m-media__ctrl" id="m-media-speed" type="button" title="倍速">1x</button>
        <button class="fui-key fui-key--sm m-media__ctrl" id="m-media-sleep" type="button" title="睡眠定时 (15 / 30 / 60m)">⏱</button>
      </div>
      <div class="m-media__progress">
        <input class="m-media__seek" id="m-media-seek" type="range" min="0" max="1000" value="0" aria-label="播放进度">
        <span class="fui-num" id="m-media-time">00:00 / 00:00</span>
      </div>
      <div class="m-media__lrc" id="m-media-lrc" hidden></div>
      <canvas class="m-media__viz" id="m-viz" height="26" role="img" aria-label="音频实时频谱"></canvas>
      <div class="m-media__queue" id="m-media-queue" hidden></div>
      <audio id="m-audio" hidden></audio>
    </section>

    <section class="m-quick" aria-label="快捷指令">
      <button class="fui-key" type="button" data-quick="请给我一份当前时刻的态势简报">态势简报</button>
      <button class="fui-key" type="button" data-quick="先来首歌吧">先来首歌</button>
      <button class="fui-key" type="button" data-quick="帮我做一次深度整理并汇报世界模型">深度整理</button>
      <button class="fui-key" type="button" id="m-new-chat">新会话</button>
    </section>

    <ul class="m-feed" id="m-feed" aria-live="polite"></ul>

    <form class="m-form" id="m-form">
      <button class="fui-key" id="m-mic" type="button" aria-label="按住或点击语音输入">语音</button>
      <input class="m-input" id="m-input" type="text" placeholder="随时给 550W 下达指令…" autocomplete="off">
      <button class="fui-btn fui-btn--primary" type="submit">发送</button>
    </form>
  </main>

  <div class="m-auth" id="m-auth" hidden>
    <form class="m-auth__card" id="m-auth-form">
      <div class="m-brand">
        <span class="fui-badge" data-state="warn">AUTH</span>
        <strong>550W · 4 位授权码验证</strong>
      </div>
      <p class="m-auth__hint">请输入 4 位字母/数字操作员授权码（不区分大小写，用于同步专属个人配置）。</p>
      <input class="m-input" id="m-auth-input" type="text" maxlength="4" placeholder="4 位操作员授权码…" autocomplete="off" style="text-transform: uppercase; letter-spacing: 0.25em; text-align: center">
      <p class="m-auth__err" id="m-auth-err" hidden></p>
      <button class="fui-btn fui-btn--primary" type="submit">验证并接入</button>
    </form>
  </div>

  <script type="module" src="/js/mobile.js"></script>
</body>
</html>
